<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Prep Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#fad95e;--bg:#faf6ea;--ink:#111;--lav:#e6e6fa;--mut:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.top{height:54px;background:var(--y);border-bottom:2px solid var(--ink);display:flex;align-items:center;padding:0 24px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.hero{max-width:1100px;margin:0 auto;padding:44px 22px 10px}
.tag{display:inline-block;background:var(--ink);color:var(--y);font:700 12px 'JetBrains Mono',monospace;letter-spacing:.14em;padding:11px 16px;border-radius:6px;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-1.3px;margin:0 0 12px;font-weight:800}
.hero p{color:var(--mut);margin:0 0 22px;max-width:620px}
.search{width:100%;max-width:420px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;font:inherit;font-size:15px;background:#fff}
.grid{max-width:1100px;margin:0 auto;padding:20px 22px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:#fff;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:20px;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.icon{width:46px;height:46px;border-radius:10px;border:2px solid var(--ink);background:var(--y);display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:19px;letter-spacing:-.3px;line-height:1.25}
.card p{margin:0 0 16px;color:#444;font-size:14px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.08em}
.pill{background:var(--lav);border:2px solid var(--ink);border-radius:99px;padding:2px 10px}
.go{font-weight:800}
#viewer{display:none;height:calc(100vh - 54px)}#viewer iframe{width:100%;height:100%;border:0;background:#faf6ea}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="top" id="top"><a href="#" id="home" style="color:inherit;text-decoration:none">Interview Prep</a><a id="newtab" href="#" target="_blank" rel="noopener" style="display:none;margin-left:auto;color:inherit;font-size:13px;font-weight:700;text-decoration:none;border:2px solid #111;border-radius:8px;padding:3px 10px;background:#fff">Open in new tab ↗</a></div>
<div id="viewer"><iframe id="frame" title="Guide"></iframe></div>
<div class="hero" id="hero">
  <span class="tag">STUDY LIBRARY</span>
  <h1>Interview Prep Library</h1>
  <p>Pick a guide below. Each one opens as its own page with questions, answers and a search box.</p>
  <input class="search" id="s" placeholder="Search guides…" autocomplete="off">
</div>
<div class="grid" id="grid"></div>

<script>
/* ADD A NEW GUIDE = ADD ONE LINE HERE.
   file: the html filename in the same folder
   count: optional text shown on the card (e.g. "224 questions")
   external: true = file is a full URL and opens in a new tab */
const GUIDES = [
  { file: "data_scientist_interview_qa_v1.html", icon: "📊", title: "Data Scientist Interview Q&A V1", desc: "ML, deep learning, statistics, SQL, LLMs, culture fit and brainteasers.", count: "224 questions" },
  { file: "data-science-interview_qa_v2.html", icon: "🧠", title: "Data Scientist Interview Q&A V2", desc: "Statistics, data analysis, machine learning, deep learning and applied practice questions with worked answers.", count: "159 questions" },
  { file: "statistics-interview_v1.html", icon: "📈", title: "Statistics Interview Q&A V1", desc: "Distributions, hypothesis testing, regression, sampling, Bayesian methods and more, in short interview-style answers.", count: "84 questions" },
  { file: "https://aptai.in/courses/ai-interview-prep/", external: true, icon: "🚀", title: "Data Scientist Interview Q&A V3", desc: "AI & ML interview prep and Q&A bundle on Apt AI.", count: "APT AI" },
  // { file: "sql.html",              icon: "🗄️", title: "SQL Practice",     desc: "Short description of the guide.", count: "30 questions" },
];

const grid = document.getElementById('grid');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(list){
  grid.innerHTML = list.length ? list.map(g => `
    <a class="card" href="#${encodeURIComponent(g.file)}">
      <div class="icon">${g.icon || '📘'}</div>
      <h2>${esc(g.title)}</h2>
      <p>${esc(g.desc || '')}</p>
      <div class="meta"><span class="pill">${esc(g.count || 'GUIDE')}</span><span class="go">OPEN →</span></div>
    </a>`).join('') : '<div class="empty">No guides match your search.</div>';
}
render(GUIDES);
document.getElementById('s').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  render(GUIDES.filter(g => (g.title + ' ' + (g.desc || '')).toLowerCase().includes(v)));
});

/* Guides open inside this page.
   Own guides: the page's top bar is hidden (the guide has its own) and the guide's logo returns home.
   External sites (e.g. Apt AI): the top bar stays so you can go back. */
const hero=document.getElementById('hero'), viewer=document.getElementById('viewer'), frame=document.getElementById('frame'), topbar=document.getElementById('top'), newtab=document.getElementById('newtab');
function setBar(show){ topbar.style.display=show?'':'none'; viewer.style.height=show?'calc(100vh - 54px)':'100vh'; }
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const g=GUIDES.find(x=>x.file===h);
  if(g){
    hero.style.display='none'; grid.style.display='none'; viewer.style.display='block';
    setBar(!!g.external);
    newtab.style.display=g.external?'inline-block':'none'; newtab.href=g.file;
    if(frame.dataset.f!==g.file){ frame.dataset.f=g.file; frame.src=g.file; }
    document.title=g.title;
  } else {
    hero.style.display=''; grid.style.display=''; viewer.style.display='none'; setBar(true); newtab.style.display='none';
    if(frame.dataset.f){ frame.removeAttribute('src'); frame.dataset.f=''; }
    document.title='Interview Prep Library';
  }
}
frame.addEventListener('load',()=>{
  const g=GUIDES.find(x=>x.file===frame.dataset.f);
  if(!g||g.external) return;
  try{
    const b=frame.contentDocument.querySelector('.brand');
    if(!b) throw 0;
    b.addEventListener('click',e=>{e.preventDefault();location.hash='';});
    b.style.cursor='pointer'; b.title='Back to home';
  }catch(err){ setBar(true); } /* can't reach the guide's logo (e.g. opened from disk): keep this page's bar */
});
document.getElementById('home').addEventListener('click',e=>{e.preventDefault();if(location.hash)location.hash='';else window.scrollTo(0,0);});
addEventListener('hashchange',route); route();
</script>
</body>
</html>
